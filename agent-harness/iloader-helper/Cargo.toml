[package]
name = "iloader-helper"
version = "0.1.0"
edition = "2024"
description = "Headless JSON helper used by the cli-anything-iloader harness"

[[bin]]
name = "iloader-helper"
path = "src/main.rs"

[dependencies]
idevice = { version = "0.1.68", features = ["usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
isideload = { version = "0.5.2", features = ["fs-storage"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
rootcause = "0.12.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tracing-subscriber ={ version = "0.3", features = ["env-filter"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }

[workspace]
